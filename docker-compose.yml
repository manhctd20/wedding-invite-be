services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding_secret
      POSTGRES_DB: wedding_invite
    ports:
      - "5544:5432"
    volumes:
      - wedding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_invite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wedding_pgdata:
